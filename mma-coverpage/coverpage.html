<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>APEX PREDATOR MMA — Cover Page</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@400;500;600;700&family=Teko:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --red:#e6191f;
    --red-lt:#ff3a34;
    --red-dk:#7c0a0d;
    --ink:#0a0a0b;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:#111;}
  body{display:flex;align-items:flex-start;justify-content:center;}

  /* ---------- noise textures ---------- */
  .grain{
    position:absolute;inset:0;pointer-events:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='260' height='260'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/></filter><rect width='260' height='260' filter='url(%23n)'/></svg>");
    opacity:.14;mix-blend-mode:overlay;
  }

  /* ---------- page / mockup shell ---------- */
  .page{position:relative;width:1080px;height:1920px;background:#0d0d0e;overflow:hidden;}

  .label{
    height:92px;display:flex;align-items:center;justify-content:center;
    background:#000;position:relative;z-index:40;
  }
  .label span{
    font-family:'Oswald',sans-serif;font-weight:600;letter-spacing:.42em;
    font-size:30px;color:#f2f2f2;text-indent:.42em;
  }

  /* concrete frame */
  .frame{
    position:relative;height:calc(1920px - 92px);padding:18px;
    background:
      radial-gradient(120% 60% at 50% 0%, #4a4a4d 0%, #2c2c2e 45%, #1a1a1c 100%);
  }
  .frame .grain{opacity:.3;mix-blend-mode:soft-light}
  .frame:before{ /* frame inner shadow */
    content:"";position:absolute;inset:0;box-shadow:inset 0 0 60px rgba(0,0,0,.85);z-index:3;pointer-events:none;
  }

  /* binder clips */
  .clip{position:absolute;top:0;width:104px;height:46px;z-index:30;filter:drop-shadow(0 6px 10px rgba(0,0,0,.7))}
  .clip.l{left:120px}.clip.r{right:120px}

  /* ---------- poster ---------- */
  .poster{
    position:relative;width:100%;height:100%;overflow:hidden;
    background:
      radial-gradient(92% 56% at 50% 33%, #300608 0%, #150304 40%, #0a0a0b 72%, #040405 100%),
      #06060700;
    isolation:isolate;
  }

  /* stage lights */
  .spot{position:absolute;pointer-events:none;mix-blend-mode:screen;filter:blur(26px);opacity:.7}
  .spot i{
    display:block;width:100%;height:100%;
    background:linear-gradient(to bottom,rgba(255,44,44,.62),rgba(255,30,30,.16) 55%,rgba(255,0,0,0) 100%);
    clip-path:polygon(38% 0,62% 0,100% 100%,0 100%);
  }
  .spot.a{top:-40px;left:-90px;width:420px;height:820px;transform:rotate(24deg)}
  .spot.b{top:-40px;right:-90px;width:420px;height:820px;transform:rotate(-24deg)}
  .spot.c{top:-60px;left:50%;margin-left:-260px;width:520px;height:640px;opacity:.5}
  .lamp{
    position:absolute;width:70px;height:70px;border-radius:50%;
    background:radial-gradient(circle,#fff 0%,#ff8b86 26%,rgba(255,26,26,.6) 52%,rgba(255,0,0,0) 72%);
    mix-blend-mode:screen;filter:blur(3px);
  }

  /* cage mesh */
  .cage{position:absolute;inset:0;width:100%;height:100%}

  /* smoke */
  .smoke{position:absolute;border-radius:50%;filter:blur(46px);mix-blend-mode:screen;pointer-events:none}

  /* octagon rings */
  .rings{position:absolute;inset:0;width:100%;height:100%;opacity:.5}

  /* fighter */
  .fighter{
    position:absolute;left:50%;transform:translateX(-50%);
    top:458px;width:660px;height:800px;z-index:6;
  }

<script>
// deterministic pseudo-random so renders are identical
let seed = 20260824;
function rnd(){ seed = (seed*1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; }

const poster = document.getElementById('poster');
const W = 1044, H = 1792;

// embers / sparks
for (let i=0;i<70;i++){
  const e = document.createElement('div');
  e.className = 'ember';
  const s = 2 + rnd()*6;
  const x = rnd()*W;
  const y = 380 + rnd()*(H-460);
  const o = .25 + rnd()*.7;
  const warm = rnd() > .45 ? '#ff7a33' : '#ff3a2a';
  e.style.cssText = `left:${x.toFixed(0)}px;top:${y.toFixed(0)}px;width:${s.toFixed(1)}px;height:${s.toFixed(1)}px;
    opacity:${o.toFixed(2)};background:${warm};box-shadow:0 0 ${(s*4).toFixed(0)}px ${(s*1.4).toFixed(0)}px ${warm};`;
  poster.appendChild(e);
}
// a few longer streak sparks
for (let i=0;i<14;i++){
  const e = document.createElement('div');
  e.className = 'ember';
  const w = 14 + rnd()*46, h = 1.6 + rnd()*1.6;
  e.style.cssText = `left:${(rnd()*W).toFixed(0)}px;top:${(500+rnd()*(H-680)).toFixed(0)}px;
    width:${w.toFixed(0)}px;height:${h.toFixed(1)}px;border-radius:2px;opacity:${(.2+rnd()*.5).toFixed(2)};
    background:linear-gradient(90deg,rgba(255,120,50,0),#ff8a3d);transform:rotate(${(-40+rnd()*80).toFixed(0)}deg);
    box-shadow:0 0 10px #ff6a2b;`;
  poster.appendChild(e);
}
</script>
